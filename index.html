<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <title>ethan的论文讲解库</title>

        <style>
            h1 {
                color:blue;
                text-align: center;

            }
            a {
                color:black;
                text-decoration: none;
            }

            body{
                background-color:rgb(216, 197, 121) ;
            }


        </style>

    </head>
    <body>
        <h1>ethan的论文讲解库</h1>

        <button data-filter="all">全部</button>
        
        <button data-filter="vision">vision</button>
        
        <button data-filter="all">全部</button>

        <h2>学习指南</h2>
        <a href="papers/alexnet/论文深度解读报告.html">可以看学习指南 </a>
        <ul>
            <li data-tag="vision">AlexNet:<a href="papers/alexnet/论文深度解读报告.html">可以看AlexNet </a></li>
            <li data-tag="vision">ResNet</li>
            <li data-tag="vision">GAN</li>
            <li data-tag="vision">VAE</li>
            <li data-tag="vhh">DDPM</li>
            <li data-tag="vision">Transformer</li>
            <li data-tag="vision">BERT</li>
            <li data-tag="noe">GPT2</li>
        </ul>

    <script>
        var button=document.querySelectorAll('button')
        var items=document.querySelectorAll('li')

        button.forEach(function(btn){
            btn.addEventListener('click',function(){
                var want=btn.getAttribute('data-filter')
                items.forEach(function(li){
                    var tag=li.getAttribute('data-tag');
                    var show=(want==='all')||(tag===want);
       
                li.style.display=show ?'':'none';
                })
            })
        })



    </script>
    </body>
    </html>
